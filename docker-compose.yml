services:
  whisper-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: rust-whisper-mcp:latest
    container_name: rust-whisper-mcp
    restart: unless-stopped
    ports:
      # Bind to the host loopback only — the /mcp and /api/transcribe/* endpoints
      # are unauthenticated, so they must not be exposed to the LAN by default.
      # Front it with a reverse proxy + auth before switching to 0.0.0.0.
      - "127.0.0.1:${WHISPER_PORT:-17800}:8080"
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      WHISPER_MODEL_PATH: /models/ggml-large-v3.bin
      WHISPER_MODEL_URL: https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3.bin
      DATA_DIR: /data
      BIND_ADDR: 0.0.0.0:8080
      # Lets transcribe_file map host-style absolute paths
      # (D:\whisper-data\clip.mp4 or /mnt/d/whisper-data/clip.mp4) onto /data.
      # Mirrors the host mount root so the README's absolute-path examples work.
      HOST_MOUNT_ROOT: ${WHISPER_DATA_DIR:-D:/whisper-data}
      # Which physical GPU CUDA sees (0-indexed). On Docker Desktop the
      # device_ids reservation below is ignored, so this is the real selector.
      # Override via GPU_INDEX in .env (see .env.example).
      CUDA_VISIBLE_DEVICES: "${GPU_INDEX:-1}"
      # ffmpeg hardware-accelerated decode for keyframe extraction: auto (GPU when
      # available, else CPU) | none (force CPU) | cuda. Default auto.
      FFMPEG_HWACCEL: ${FFMPEG_HWACCEL:-auto}
      # Optional blended USD-per-1M-tokens rate for estimate_video_cost. Empty =
      # token counts only, no $ figure (model-agnostic; set to your model's rate).
      TOKEN_COST_USD_PER_MTOK: ${TOKEN_COST_USD_PER_MTOK:-}
    volumes:
      # Host directory dropped into the container at /data. Set WHISPER_DATA_DIR
      # in .env (Windows/Docker Desktop wants forward slashes, e.g. D:/whisper-data).
      - "${WHISPER_DATA_DIR:-D:/whisper-data}:/data"
      - "whisper-models:/models"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_INDEX:-1}"]   # 0-indexed; matches CUDA_VISIBLE_DEVICES
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  whisper-models:

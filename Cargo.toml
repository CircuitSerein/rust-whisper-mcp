[package]
name = "rust-whisper-mcp"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local MCP + REST server wrapping Whisper large-v3 on GPU: transcribe local media or YouTube URLs."
repository = "https://github.com/CircuitSerein/rust-whisper-mcp"
readme = "README.md"
keywords = ["whisper", "mcp", "transcription", "cuda", "speech-to-text"]
categories = ["multimedia::audio", "command-line-utilities"]
# Not a library/crate for crates.io — this is a deployable server. Guard against
# an accidental `cargo publish`.
publish = false

[dependencies]
rmcp = { version = "1.5", features = [
    "server",
    "macros",
    "transport-streamable-http-server",
] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }

whisper-rs = { version = "0.16" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"

anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

url = "2"
uuid = { version = "1", features = ["v4"] }
which = "7"

[features]
# GPU build is the default (and what the Docker image uses). CI and CPU-only
# dev disable it with `--no-default-features`, which builds whisper.cpp for CPU
# and skips the CUDA toolkit requirement.
default = ["cuda"]
cuda = ["whisper-rs/cuda"]

[profile.release]
lto = "thin"
codegen-units = 1

version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor:
        update-types: [minor, patch]
    # Policy: stay current, majors included. Minor/patch are grouped into one PR;
    # majors surface as individual PRs to take deliberately. Note: an rmcp major
    # governs axum/schemars transitively — when taking one, bump axum in lockstep
    # and re-verify the build (see the rmcp 1.x→2.x migration for the pattern).

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

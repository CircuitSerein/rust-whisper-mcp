version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor:
        update-types: [minor, patch]
    ignore:
      # These are constrained by rmcp (it pulls axum 0.8 / schemars 1.x
      # transitively). Bumping our direct pins piecemeal desyncs us from rmcp —
      # upgrade them only as part of a deliberate rmcp bump, not automatically.
      - dependency-name: "axum"
      - dependency-name: "schemars"
      - dependency-name: "tower"
      - dependency-name: "tower-http"
      # Take major bumps deliberately, not on autopilot.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
